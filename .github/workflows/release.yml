name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build (ReleaseSmall, Windows + Linux)
        run: zig build release

      - name: Assemble release assets
        run: |
          ver="${GITHUB_REF_NAME#v}"

          # Linux tarball (consumed by the Arch PKGBUILD): binaries plus the
          # systemd unit, udev rules and license at the archive root.
          stage="dygmate-${ver}-x86_64"
          mkdir "${stage}"
          cp zig-out/linux/dygmate zig-out/linux/dygmate-tray "${stage}/"
          cp dygmate-tray.service 99-dygmate.rules LICENSE "${stage}/"
          tar -C "${stage}" -czf "${stage}.tar.gz" .

          # Windows zip (winget's NestedInstallerFiles expect the exes at the
          # archive root).
          (cd zig-out/windows && zip "${GITHUB_WORKSPACE}/dygmate-${ver}-windows-x86_64.zip" dygmate.exe dygmate-tray.exe)

          sha256sum "dygmate-${ver}-x86_64.tar.gz" "dygmate-${ver}-windows-x86_64.zip" | tee SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dygmate-*-x86_64.tar.gz
            dygmate-*-windows-x86_64.zip
            SHA256SUMS.txt
